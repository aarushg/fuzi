services:
  api:
    build: .
    image: fuzi-ops-api:local
    command: npm run prod
    environment:
      FUZI_API_PORT: "5000"
      FUZI_DB_PATH: /app/fuzi.sqlite3
      FUZI_PORTAL_TOKEN_TTL_MINUTES: ${FUZI_PORTAL_TOKEN_TTL_MINUTES:-480}
      FUZI_LOGIN_WINDOW_MINUTES: ${FUZI_LOGIN_WINDOW_MINUTES:-10}
      FUZI_LOGIN_MAX_ATTEMPTS: ${FUZI_LOGIN_MAX_ATTEMPTS:-8}
      FUZI_OPENCLAW_URL: ${FUZI_OPENCLAW_URL:-}
      FUZI_OPENCLAW_ADDRESS: ${FUZI_OPENCLAW_ADDRESS:-}
      FUZI_OPENCLAW_HOST: ${FUZI_OPENCLAW_HOST:-host.docker.internal}
      FUZI_OPENCLAW_PORT: ${FUZI_OPENCLAW_PUBLISHED_PORT:-${FUZI_OPENCLAW_PORT:-18789}}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FUZI_API_PUBLISHED_PORT:-5000}:5000"
      - "${FUZI_WEB_PUBLISHED_PORT:-8082}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    profiles: ["dev"]
    build: .
    image: fuzi-ops-web:local
    command: npm --prefix expo-app run web -- --host lan --port 8082
    environment:
      EXPO_PUBLIC_FUZI_API_URL: ${EXPO_PUBLIC_FUZI_API_URL:-}
      EXPO_PUBLIC_FUZI_API_PROTOCOL: ${EXPO_PUBLIC_FUZI_API_PROTOCOL:-http}
      EXPO_PUBLIC_FUZI_API_HOST: ${EXPO_PUBLIC_FUZI_API_HOST:-127.0.0.1}
      EXPO_PUBLIC_FUZI_API_PORT: ${EXPO_PUBLIC_FUZI_API_PORT:-${FUZI_API_PUBLISHED_PORT:-5000}}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    ports:
      - "${FUZI_DEV_WEB_PUBLISHED_PORT:-8083}:8082"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
